<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin · Édition projet — Lucas Luisetti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg-top: #322D28;
    --bg-mid: #3D3832;
    --bg-bot: #45403A;
    --bg: #3D3832;
    --fg: #F5F1EA;
    --fg-muted: #B5B0A4;
    --fg-faint: rgba(245,241,234,0.55);
    --amber: #D88E3D;
    --amber-bright: #E8A04A;
    --hairline: rgba(245,241,234,0.10);
    --hairline-strong: rgba(245,241,234,0.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{
    font-family:"Euclid Circular A","Geist","Inter",-apple-system,system-ui,sans-serif;
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
    background-attachment: fixed;
    overflow-x:hidden; min-height:100vh;
  }
  ::selection{background:var(--amber);color:#111}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}

  /* TOPBAR */
  .topbar{
    position: relative;
    display:flex;justify-content:space-between;align-items:center;
    padding:28px 48px;z-index:60;
  }
  .crumb{
    display:inline-flex;align-items:center;gap:14px;
    color:var(--amber-bright); font-size:12px;
    letter-spacing:.32em; text-transform:uppercase;
    font-family:"Geist Mono",monospace;
  }
  .crumb .dash{ width:18px;height:1px;background:var(--amber) }
  .back-link{
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;color:var(--fg-muted);
    transition:color .35s ease, gap .35s cubic-bezier(.2,.7,.2,1);
  }
  .back-link svg{ width:14px;height:14px }
  .back-link:hover{ color:var(--amber-bright); gap:14px }

  /* PAGE */
  .page{ max-width: 1100px; margin: 0 auto; padding: 60px 48px 120px }
  .page-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:32px; margin-bottom:48px;
  }
  .page-header h1{
    font-size: clamp(40px,5vw,60px);
    font-weight:500; letter-spacing:-.025em;
    line-height:1.02;
  }
  .page-header .subtitle{
    margin-top:14px; font-size:16px; color:var(--fg-muted);
    max-width:520px;
  }
  .page-header .actions{ display:flex; gap:12px }

  /* BTN */
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:12px 22px; border-radius:999px;
    font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    border:1px solid var(--hairline); color:var(--fg);
    background:transparent; cursor:pointer; white-space:nowrap;
    transition: background .3s ease, border-color .3s ease, color .3s ease, transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .btn:hover{ background:var(--fg); border-color:var(--fg); color:var(--bg); transform: translate(2px,-2px) }
  .btn svg{ width:14px; height:14px }
  .btn-amber{ border-color:var(--amber); color:var(--amber-bright) }
  .btn-amber:hover{ background:var(--amber); border-color:var(--amber); color:#1A1614 }
  .btn-link{ /* "Annuler" — bare text link */
    border:0; padding:12px 4px; color:var(--fg-muted);
    letter-spacing:.18em; text-transform:uppercase; font-size:12px;
    transition: color .25s ease;
  }
  .btn-link:hover{ color: var(--amber-bright); transform:none; background:transparent }

  /* CARDS */
  .card{
    position:relative; border-radius:18px;
    background: transparent;
    border:1px solid var(--hairline);
    margin-bottom:28px;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 28px; border-bottom:1px solid var(--hairline);
  }
  .card-head h2{
    font-size:14px; letter-spacing:.32em; text-transform:uppercase;
    font-weight:500; color:var(--fg);
    display:inline-flex; align-items:center; gap:14px;
  }
  .card-head h2 .hairline{ width:24px; height:1px; background:var(--amber) }
  .card-head .hint{
    font-family:"Geist Mono",monospace; font-size:11px;
    color:var(--fg-muted); letter-spacing:.12em;
  }
  .card-body{ padding:28px }

  /* FORM CONTROLS */
  .field{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px }
  .field:last-child{ margin-bottom:0 }
  .label{
    font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--fg-muted); font-family:"Geist Mono",monospace;
  }
  .input, .textarea{
    width:100%;
    padding:14px 20px;
    border-radius:999px;
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--fg);
    font:inherit; font-size:15px;
    transition: border-color .25s ease, background .25s ease;
  }
  .textarea{
    border-radius:18px;
    min-height: 160px;
    resize: vertical;
    line-height:1.6;
    padding:16px 20px;
  }
  .input::placeholder, .textarea::placeholder{ color: var(--fg-faint) }
  .input:focus, .textarea:focus{
    outline:0;
    border-color: var(--amber);
    background: rgba(216,142,61,0.05);
  }

  .field-row{
    display:grid; grid-template-columns: 1fr 1fr auto;
    gap:12px; align-items:center; margin-bottom:10px;
  }

  /* ROUND ICON BTN — same as projects list */
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid var(--hairline);
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--fg);
    background:transparent;
    transition: background .3s ease, border-color .3s ease, color .3s ease, transform .35s cubic-bezier(.2,.7,.2,1);
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--fg); border-color:var(--fg); color:var(--bg); transform: translate(2px,-2px) }
  .icon-btn.danger:hover{ background:var(--amber); border-color:var(--amber); color:#1A1614 }
  .icon-btn svg{ width:16px; height:16px }

  /* + Ajouter (inline link) */
  .add-link{
    display:inline-flex; align-items:center; gap:10px;
    margin-top:8px;
    padding: 10px 18px;
    border-radius:999px;
    border:1px dashed var(--hairline-strong);
    color:var(--fg-muted);
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    transition: border-color .3s ease, color .3s ease, background .3s ease, transform .35s cubic-bezier(.2,.7,.2,1);
    cursor:pointer;
  }
  .add-link:hover{
    border-color:var(--amber);
    color:var(--amber-bright);
    background: rgba(216,142,61,0.05);
    transform: translate(2px,-2px);
  }
  .add-link svg{ width:14px; height:14px }

  /* TECHNOLOGIES — chip selector */
  .chips{ display:flex; flex-wrap:wrap; gap:8px }
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--hairline);
    color:var(--fg-muted);
    font-size:12px; letter-spacing:.08em;
    background:transparent;
    cursor:pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .chip:hover{ color:var(--fg); border-color:var(--hairline-strong) }
  .chip.active{
    color: var(--amber-bright);
    border-color: rgba(216,142,61,0.45);
    background: rgba(216,142,61,0.08);
  }
  .chip .x{
    display:inline-flex; width:14px; height:14px;
    align-items:center; justify-content:center;
    opacity: 0; width:0; transition: width .2s ease, opacity .2s ease;
  }
  .chip.active .x{ opacity:.7; width:14px; margin-left:2px }

  /* IMAGES — gallery */
  .gallery{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap:12px;
  }
  .thumb{
    position:relative;
    aspect-ratio: 4/3;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--hairline);
    background:
      linear-gradient(135deg, rgba(245,241,234,0.06), rgba(245,241,234,0.02));
  }
  .thumb-img-placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color: var(--fg-faint);
    background:
      repeating-linear-gradient(45deg, rgba(245,241,234,0.04) 0 6px, transparent 6px 12px);
  }
  .thumb-img-placeholder svg{ width:32px; height:32px; opacity:.5 }
  .thumb .remove{
    position:absolute; top:8px; right:8px;
    width:28px; height:28px; border-radius:50%;
    background: rgba(20,16,12,0.7);
    border: 1px solid var(--hairline-strong);
    color: var(--fg);
    display:inline-flex; align-items:center; justify-content:center;
    transition: background .25s ease, color .25s ease;
    backdrop-filter: blur(8px);
  }
  .thumb .remove:hover{ background:var(--amber); color:#1A1614 }
  .thumb .remove svg{ width:12px; height:12px }
  .thumb .order-badge{
    position:absolute; left:8px; bottom:8px;
    padding:3px 8px;
    font-family:"Geist Mono",monospace;
    font-size:10px; letter-spacing:.12em;
    border-radius:999px;
    background: rgba(20,16,12,0.6);
    color: var(--fg);
    border:1px solid var(--hairline);
    backdrop-filter: blur(8px);
  }

  /* FILE UPLOAD */
  .upload{
    display:flex; align-items:center; gap:14px;
    padding: 16px 20px;
    border-radius:999px;
    border:1px dashed var(--hairline-strong);
    color: var(--fg-muted);
    cursor:pointer;
    transition: border-color .3s ease, color .3s ease, background .3s ease;
    margin-top:14px;
  }
  .upload:hover{ border-color:var(--amber); color:var(--amber-bright); background: rgba(216,142,61,0.04) }
  .upload svg{ width:18px; height:18px }
  .upload-hint{ margin-left:auto; font-family:"Geist Mono",monospace; font-size:11px; color:var(--fg-faint); letter-spacing:.12em }

  /* VISIBILITY TOGGLE (segmented) */
  .toggle-group{
    display:inline-flex; padding:4px;
    border:1px solid var(--hairline);
    border-radius:999px;
    background: transparent;
  }
  .toggle-opt{
    padding:8px 16px;
    border-radius:999px;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color: var(--fg-muted);
    cursor:pointer;
    transition: color .25s ease, background .25s ease;
  }
  .toggle-opt:hover{ color: var(--fg) }
  .toggle-opt.on{
    background: var(--amber);
    color: #1A1614;
  }

  /* FORM ACTIONS BAR (sticky bottom) */
  .form-actions{
    display:flex; justify-content:flex-end; align-items:center;
    gap:14px;
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid var(--hairline);
  }

  /* MOBILE */
  @media (max-width: 900px){
    .topbar{ padding:18px 24px }
    .page{ padding: 40px 20px 80px }
    .page-header{ flex-direction:column; align-items:flex-start; gap:24px }
    .field-row{ grid-template-columns: 1fr; gap:8px }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="crumb">
    <span class="dash"></span>
    <span>Admin · Édition projet</span>
  </div>
  <a class="back-link" href="portfolio.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
    </svg>
    <span>Back to home</span>
  </a>
</header>

<main class="page">

  <div class="page-header">
    <div>
      <h1>CSV Checker.</h1>
      <p class="subtitle">Édite le contenu, les liens et les médias de ce projet.</p>
    </div>
  </div>

  <form>

    <!-- INFORMATIONS -->
    <section class="card">
      <div class="card-head">
        <h2><span class="hairline"></span>Informations</h2>
      </div>
      <div class="card-body">
        <div class="field">
          <label class="label" for="title">Titre</label>
          <input class="input" id="title" type="text" value="CSV Checker" placeholder="Ex. Helio Dispatch">
        </div>
        <div class="field">
          <label class="label" for="summary">Résumé</label>
          <input class="input" id="summary" type="text" value="Application permettant de détecter, analyser et corriger les erreurs présentes dans des fichiers CSV." placeholder="Une phrase pour décrire le projet">
        </div>
        <div class="field">
          <label class="label" for="desc">Description</label>
          <textarea class="textarea" id="desc" placeholder="Description complète du projet, de la stack, des décisions techniques…">Outil de vérification de fichiers CSV conçu pour analyser automatiquement la structure et le contenu des données. Il détecte les erreurs courantes comme les formats invalides, les valeurs manquantes, les doublons ou les incohérences entre colonnes. L'application propose ensuite des corrections adaptées ou des suggestions pour faciliter le nettoyage des données.</textarea>
        </div>
      </div>
    </section>

    <!-- LIENS -->
    <section class="card">
      <div class="card-head">
        <h2><span class="hairline"></span>Liens</h2>
      </div>
      <div class="card-body">
        <div class="field-row">
          <input class="input" type="text" value="Démo" placeholder="Libellé">
          <input class="input" type="url" value="https://csv-checker.demo" placeholder="https://...">
          <button class="icon-btn danger" type="button" aria-label="Supprimer le lien" title="Supprimer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
            </svg>
          </button>
        </div>
        <div class="field-row">
          <input class="input" type="text" value="GitHub" placeholder="Libellé">
          <input class="input" type="url" value="https://github.com/lluisetti/csv-checker" placeholder="https://...">
          <button class="icon-btn danger" type="button" aria-label="Supprimer le lien" title="Supprimer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
            </svg>
          </button>
        </div>

        <button class="add-link" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"/><path d="M5 12h14"/>
          </svg>
          Ajouter un lien
        </button>
      </div>
    </section>

    <!-- TECHNOLOGIES -->
    <section class="card">
      <div class="card-head">
        <h2><span class="hairline"></span>Technologies</h2>
      </div>
      <div class="card-body">
        <div class="chips">
          <button type="button" class="chip active">Python <span class="x">×</span></button>
          <button type="button" class="chip active">Pandas <span class="x">×</span></button>
          <button type="button" class="chip active">FastAPI <span class="x">×</span></button>
          <button type="button" class="chip">React</button>
          <button type="button" class="chip">TypeScript</button>
          <button type="button" class="chip">Node.js</button>
          <button type="button" class="chip">PostgreSQL</button>
          <button type="button" class="chip">Docker</button>
          <button type="button" class="chip">Tailwind</button>
          <button type="button" class="chip">Vite</button>
          <button type="button" class="chip">Symfony</button>
          <button type="button" class="chip">Vue</button>
        </div>
      </div>
    </section>

    <!-- IMAGES -->
    <section class="card">
      <div class="card-head">
        <h2><span class="hairline"></span>Images</h2>
      </div>
      <div class="card-body">
        <div class="gallery">
          <div class="thumb">
            <div class="thumb-img-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
              </svg>
            </div>
            <span class="order-badge">01</span>
            <button type="button" class="remove" aria-label="Retirer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="thumb">
            <div class="thumb-img-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
              </svg>
            </div>
            <span class="order-badge">02</span>
            <button type="button" class="remove" aria-label="Retirer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="thumb">
            <div class="thumb-img-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
              </svg>
            </div>
            <span class="order-badge">03</span>
            <button type="button" class="remove" aria-label="Retirer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        </div>

        <label class="upload" for="files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" x2="12" y1="3" y2="15"/>
          </svg>
          <span>Ajouter des images — glisse-dépose ou clique</span>
          <span class="upload-hint">PNG · JPG · WEBP</span>
          <input id="files" type="file" multiple hidden accept="image/*">
        </label>
      </div>
    </section>

    <!-- ACTIONS -->
    <div class="form-actions">
      <button class="btn-link" type="button" onclick="window.location.href='admin-projects.html'">Annuler</button>
      <button class="btn btn-amber" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Sauvegarder
      </button>
    </div>

  </form>

</main>

<script>
  // Chip toggle
  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => c.classList.toggle('active'));
  });

</script>
</body>
</html>
